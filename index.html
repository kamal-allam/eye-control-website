<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eye Control Assistive System</title>
<link rel="stylesheet" href="css/style.css">
<script defer src="js/app.js"></script>
</head>
<body>

<header>
    <h1>Assistive Eye-Control System</h1>
</header>

<main>

    <!-- NEEDS FIRST (MOST IMPORTANT) -->
     <section class="actions">
        <h2>Needs</h2>

        <div class="card">
            <img src="images/water.png">
            <p>Water</p>
        </div>

        <div class="card">
            <img src="images/Food.png">
            <p>Food</p>
        </div>

        <div class="card">
            <img src="images/bathroom.png">
            <p>Bathroom</p>
        </div>

        <div class="card">
            <img src="images/medicine.png">
            <p>Medicine</p>
        </div>

         <div class="card">
            <img src="images/doctor.png">
            <p>Doctor</p>
        </div>

        <div class="card">
            <img src="images/juice.png">
            <p>Juice</p>
        </div>

        <div class="card">
            <img src="images/tea.png">
            <p>Tea</p>
        </div>
        

        <div class="card">
            <img src="images/shower.png">
            <p>Shower</p>
        </div>

        <div class="card">
            <img src="images/sleep.png">
            <p>Sleep</p>
        </div>

        <div class="card">
            <img src="images/movie.png">
            <p>Movie</p>
        </div>
        <div class="card">
    <img src="images/cold.png">
    <p>Cold</p>
</div>

<div class="card">
    <img src="images/hot.png">
    <p>Hot</p>
</div>
<div class="card">
    <img src="images/boring.png">
    <p>Boring</p>
</div>
            
        <div class="card emergency">
            <img src="images/emergency.png">
            <p>Emergency</p>
        </div>
    </section>

    <!-- KEYBOARD AFTER NEEDS -->
    <section class="keyboard">
        <h2>Keyboard</h2>

        <!-- TEXT OUTPUT ABOVE KEYS -->
        <textarea id="output" placeholder="Text will appear here..."></textarea>

        <div class="keys">
            <button>A</button><button>B</button><button>C</button><button>D</button><button>E</button>
            <button>F</button><button>G</button><button>H</button><button>I</button><button>J</button>
            <button>K</button><button>L</button><button>M</button><button>N</button><button>O</button>
            <button>P</button><button>Q</button><button>R</button><button>S</button><button>T</button>
            <button>U</button><button>V</button><button>W</button><button>X</button><button>Y</button>
            <button>Z</button><button class="wide">SPACE</button><button class="wide">DEL</button><button class="wide enter-btn">ENTER</button>
        </div>
    </section>

</main>

<footer>
    <p>Eye-Controlled Website | Designed for Accessibility</p>
</footer>

</body>
